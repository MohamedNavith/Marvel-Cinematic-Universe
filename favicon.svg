<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff8f00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mcuRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e23636"/>
      <stop offset="100%" stop-color="#b01010"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#040810" stroke="#ffd54f" stroke-width="1.2" stroke-opacity="0.3"/>
  <!-- Sacred Timeline Rings -->
  <circle cx="32" cy="32" r="24" stroke="#ffb300" stroke-width="1.8" stroke-dasharray="3 1.5" stroke-opacity="0.8" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="27" stroke="#ff8f00" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Glowing Nodes on Timeline -->
  <circle cx="32" cy="8" r="2" fill="#ffd54f" filter="url(#glow)"/>
  <circle cx="56" cy="32" r="2" fill="#ffd54f" filter="url(#glow)"/>
  <circle cx="32" cy="56" r="2" fill="#ffd54f" filter="url(#glow)"/>
  <circle cx="8" cy="32" r="2" fill="#ffd54f" filter="url(#glow)"/>
  <!-- Center Marvel Red Shield -->
  <rect x="15" y="21" width="34" height="22" rx="3" fill="url(#mcuRed)"/>
  <!-- Stylized M -->
  <path d="M21 38V26H25L28.5 32.5L32 26H36V38H32.5V30.5L29.5 36H27.5L24.5 30.5V38H21Z" fill="#FFFFFF"/>
  <path d="M38.5 26H43V38H38.5V26Z" fill="#FFFFFF"/>
</svg>
